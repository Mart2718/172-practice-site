  hint: Tangent is sine over cosine and cotangent is cosine over sine, so each is undefined where its denominator is \(0\). Set the inside of the function equal to the first excluded angle plus a multiple of the period, then solve for \(x\). The period of \(\tan(kx)\) and \(\cot(kx)\) is \(\dfrac{\pi}{|k|}\). For the range, ask whether the outputs of tangent and cotangent are limited to an interval.
  slips:
  - Using \(2\pi\) as the period of tangent or cotangent. Their basic period is \(\pi\).
  - Setting the inside of the function equal to an excluded angle but forgetting to divide by \(k\) when solving for \(x\).
  - Giving a restricted range such as \([-1, 1]\), which belongs to sine and cosine. Check whether tangent and cotangent outputs are limited.
