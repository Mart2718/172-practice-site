  hint: Secant is \(\dfrac{1}{\cos}\) and cosecant is \(\dfrac{1}{\sin}\), so each is undefined where that cosine or sine is \(0\). For a stretch factor \(a\), start from the fact that sine and cosine stay between \(-1\) and \(1\), then ask what taking the reciprocal does to those values. The basic period is \(2\pi\), divided by \(|k|\).
  slips:
  - Giving \([-a, a]\) or all real numbers as the range. Pick a value inside \([-a, a]\) and ask whether the graph can reach it.
  - Using the zeros of sine to find the asymptotes of secant, or the zeros of cosine for cosecant. Secant uses cosine and cosecant uses sine.
  - Using \(\pi\) as the period of secant or cosecant.
