  hint: The input to \(\arcsin\) or \(\arccos\) is a sine or cosine value, so the domain is \([-1, 1]\). The input to \(\arctan\) can be any real number. The range is the restricted interval of the original function. Shifts and stretches change the domain or range in the usual way.
