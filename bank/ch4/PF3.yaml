  hint: The output of an inverse trig function is an angle. Ask which angle, inside the restricted interval for that function, has the given sine, cosine, or tangent. \(\arcsin\) returns an angle in \(\left[-\dfrac{\pi}{2}, \dfrac{\pi}{2}\right]\), \(\arccos\) in \([0, \pi]\), and \(\arctan\) in \(\left(-\dfrac{\pi}{2}, \dfrac{\pi}{2}\right)\).
  slips:
  - Giving an angle outside the restricted interval, such as \(\dfrac{4\pi}{3}\) for \(\arccos\left(-\dfrac{1}{2}\right)\) instead of \(\dfrac{2\pi}{3}\).
  - Reading \(\arcsin x\) as \(\dfrac{1}{\sin x}\). The \(-1\) in \(\sin^{-1}\) means inverse function, not reciprocal.
  - Giving \(\dfrac{11\pi}{6}\) for \(\arcsin\left(-\dfrac{1}{2}\right)\) instead of \(-\dfrac{\pi}{6}\). The output must lie in \(\left[-\dfrac{\pi}{2}, \dfrac{\pi}{2}\right]\).
