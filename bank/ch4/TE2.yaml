  hint: Choose one side, usually the more complicated one, and work only on that side until it matches the other. If you are stuck, rewrite everything in sines and cosines. Do not move terms across the equals sign.
  slips:
  - Starting from the whole equation and doing the same thing to both sides. Verifying means changing one side into the other.
  - Canceling a term that is added instead of multiplied, such as canceling \(\cos x\) in \(\dfrac{\cos x + 1}{\cos x}\).
  - Using a wrong Pythagorean identity, such as \(1 - \sin^{2}x = \sin x\).
