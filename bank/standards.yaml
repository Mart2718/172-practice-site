# The 38 Math 172 standards, in course order. Titles for Chapter 1 come from blueprints/ch1.md; the rest from the CheckIt support pages.
# chapter: 1-2 are covered by Exam 1, 3-4 by Exam 2, and the Final covers everything (Chapter 5 first appears on the Final).
standards:
  - code: FN1
    title: 'Introduction to Functions'
    chapter: 1
    section: '1.1'
    blurb: 'Is a relation a function?'
  - code: FN2
    title: 'Function Notation'
    chapter: 1
    section: '1.2'
    blurb: 'Function notation: evaluating piecewise functions, and reading inputs and outputs from a graph'
  - code: FN3
    title: 'Characteristics of a Function''s Graph'
    chapter: 1
    section: '1.2'
    blurb: 'Graph features: domain and range, intercepts, maxima and minima, and where a function increases and decreases'
  - code: LF1
    title: 'Slope and Average Rate of Change'
    chapter: 1
    section: '1.3'
    blurb: 'Average rate of change of a function on an interval, and the slope of a line from points, a table, or a graph'
  - code: LF2
    title: 'Equations of Lines'
    chapter: 1
    section: '1.4'
    blurb: 'Equations of lines: slope and y-intercept from standard form, and equations from a point and slope, two points, or a graph'
  - code: LF3
    title: 'Graphs of Linear Equations'
    chapter: 1
    section: '1.4'
    blurb: 'Graphing lines from points, intercepts, a slope, or an equation in any form, including horizontal and vertical lines'
  - code: LF5
    title: 'Linear Models and Meanings'
    chapter: 1
    section: '1.4'
    blurb: 'Linear models from word problems: the meaning of slope and intercept, writing the model, and using it to find an input or an output'
  - code: PR1
    title: 'Graphing Quadratic Functions'
    chapter: 1
    section: '1.5'
    blurb: 'Graphing quadratic functions: which way the parabola opens, the vertex as a maximum or minimum, the axis of symmetry, and a sketch'
  - code: PR2
    title: 'Quadratic Models'
    chapter: 1
    section: '1.5'
    blurb: 'Quadratic models in context: when a quantity reaches its maximum or minimum, how high or low it gets, and what those numbers mean'
  - code: FN5
    title: 'Operations and Composition'
    chapter: 1
    section: '1.6'
    blurb: 'Combining functions: sums, differences, products, quotients, and compositions, as formulas and as values'
  - code: FN6
    title: 'Inverse Functions'
    chapter: 1
    section: '1.7'
    blurb: 'Inverse functions: what an inverse undoes, and finding the inverse of a power or root function and of a fraction'
  - code: FN4
    title: 'Transformations of Functions'
    chapter: 1
    section: '1.8'
    blurb: 'Transformations: shifting, reflecting, and sketching a new graph from an old one'
