  - code: TR5
    title: 'Exact Trig Values'
    chapter: 2
    blurb: 'Exact values of the six trig functions from special angles, from a point on the unit circle, and from one coordinate and a quadrant'
  - code: PF1
    title: 'Graphs of Sine and Cosine'
