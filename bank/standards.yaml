    title: 'Properties of Logarithms'
    chapter: 3
    blurb: 'Properties of logarithms: expanding and condensing logarithmic expressions'
  - code: EL6
    title: 'Solving Exponential and Logarithmic Equations'
    chapter: 3
    blurb: 'Solving exponential and logarithmic equations'
  - code: EL7
    title: 'Applications of Exponential and Logarithmic Functions'
    chapter: 3
