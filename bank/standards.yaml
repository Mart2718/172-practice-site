  - code: EL3
    title: 'Introduction to Logarithms'
    chapter: 3
    blurb: 'Introduction to logarithms: converting between forms and evaluating'
  - code: EL4
    title: 'Graphing Logarithmic Functions'
    chapter: 3
    blurb: 'Graphing logarithmic functions: domain, range, and asymptotes'
