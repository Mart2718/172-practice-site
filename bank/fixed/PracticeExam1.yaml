  stem: The graph shows \(g(x) = \sqrt{x}\) and a secant line through \(A(1,1)\) and \(B(4,2)\).
  parts:
  - q: Find the average rate of change of \(g\) on \([1,4]\).
    a: \(\dfrac{g(4) - g(1)}{4 - 1} = \dfrac{2 - 1}{3} = \dfrac{1}{3}\).
  - q: Explain what that value tells you about the secant line.
    a: 'It is the slope of the secant line through \(A\) and \(B\): the line rises \(1\) unit for every \(3\) units to the right.'
