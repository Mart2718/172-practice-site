- id: PE1-38
  standard: FN5
  stem: Use the table to evaluate each expression. Show the inner lookup first in each case.
  parts:
  - q: \(f(g(-2))\)
    a: \(g(-2) = 2\), so \(f(g(-2)) = f(2) = 2\).
  - q: \(g(f(0))\)
    a: \(f(0) = -2\), so \(g(f(0)) = g(-2) = 2\).
  - q: \(f(g(1))\)
    a: \(g(1) = 3\), so \(f(g(1)) = f(3) = -1\).
  - q: \(g(g(0))\)
    a: \(g(0) = 1\), so \(g(g(0)) = g(1) = 3\).
  hint: Work from the inside out. Look up the inner value first, then use it as the input to the outer function.
  slips:
  - Looking up the outer function first.
  - Using the wrong row. Check which row is \(f\) and which is \(g\).
  - In (d), treating \(g(g(0))\) as \(g(0)\cdot g(0)\). It means apply \(g\) twice.
