- id: PE1-21
  standard: LF1
  stem: Let \(f(x) = x^{2} - 4x\). Find the average rate of change on each interval.
  parts:
  - q: \([1,4]\)
    a: \(f(4) = 0\) and \(f(1) = -3\), so the average rate of change is \(\dfrac{0-(-3)}{4-1} = 1\).
  - q: \([0,3]\)
    a: \(f(3) = -3\) and \(f(0) = 0\), so the average rate of change is \(\dfrac{-3-0}{3-0} = -1\).
  hint: The average rate of change on \([a,b]\) is \(\dfrac{f(b) - f(a)}{b - a}\). It is the slope of the line through the two points of the graph.
  slips:
  - Subtracting in a different order on the top and the bottom.
  - Stopping at \(f(b) - f(a)\) without dividing by \(b - a\).
  - Mis-evaluating \(f(4)\) as \(16 - 4\). The second term is \(4x\), so it is \(4\cdot 4\).
- id: PE1-22
  standard: LF1
  stem: A cyclist's position, in miles along a trail, after \(t\) hours is \(p(t) = 12t + 3\).
  parts:
  - q: Find the average rate of change over \([1,4]\), including units.
    a: \(\dfrac{p(4) - p(1)}{4 - 1} = \dfrac{51 - 15}{3} = 12\) miles per hour.
  - q: Explain what this rate means in the context of the ride.
    a: The cyclist moves at a constant \(12\) miles per hour. Every hour the cyclist's position along the trail increases by \(12\) miles.
  hint: For a linear function the average rate of change on any interval equals the slope. The units are (output units) per (input unit).
  slips:
  - Leaving off the units.
  - Saying "the cyclist is 12 miles from the start". A rate describes change, not position.
  - Reporting a position, \(15\) or \(51\), instead of the change in position per hour.
- id: PE1-23
  standard: FN4
  stem: ''
  parts:
  - q: Describe the sequence of transformations that produces \(g(x) = -f(x+3) - 5\) from the parent function \(f(x)\).
    a: Shift left \(3\), reflect across the \(x\)-axis, then shift down \(5\).
  - q: Let \(f(x) = x^{2}\). Write \(g(x)\) if the graph of \(f\) is shifted left \(3\) units, vertically stretched by a factor of \(2\), and shifted up \(4\) units.
    a: \(g(x) = 2(x+3)^{2} + 4\).
  hint: A change inside the parentheses acts on \(x\) and moves the graph sideways, opposite to how the sign looks. A change outside acts on the output.
  slips:
  - 'Shifting right for \(x + 3\). Inside changes work backward: \(x + 3\) moves the graph left.'
  - Shifting up because of the minus sign in front of \(f\). The \(-5\) outside shifts down; the leading minus reflects.
  - 'Putting the stretch factor inside the parentheses: \((2x+3)^{2}\) is not the same as \(2(x+3)^{2}\).'
- id: PE1-24
  standard: FN4
  stem: The parent function \(f(x) = |x|\) has its vertex at \((0,0)\). A transformed function \(g(x)\) has its vertex at \((2,-3)\), opens downward, and has the same width as the parent function.
  parts:
  - q: Write the coordinate mapping for the vertex.
    a: \((0,0) \rightarrow (2,-3)\).
  - q: Write \(g(x)\) in terms of \(f(x)\).
    a: \(g(x) = -f(x-2) - 3\).
  - q: Write the explicit formula for \(g(x)\).
    a: \(g(x) = -|x-2| - 3\).
  hint: 'Move the vertex first: how far right or left, how far up or down. "Opens downward" means a reflection across the \(x\)-axis. "Same width" means no stretch or compression.'
  slips:
  - Writing \(f(x+2)\) for a shift right \(2\). To move right, subtract inside.
  - Writing \(+3\) at the end. The vertex moved down, so subtract.
  - Leaving out the reflection, which gives a graph that opens upward.
- id: PE1-25
  standard: TR2
  stem: Find one positive and one negative angle coterminal with each angle.
  parts:
  - q: \(\theta = 170\text{°}\)
    a: 'One answer: \(170\text{°} + 360\text{°} = 530\text{°}\) and \(170\text{°} - 360\text{°} = -190\text{°}\). Any \(170\text{°} + 360\text{°}k\) with \(k\) an integer works.'
  - q: \(\theta = -\dfrac{3\pi}{4}\)
    a: 'One answer: \(-\dfrac{3\pi}{4} + 2\pi = \dfrac{5\pi}{4}\) and \(-\dfrac{3\pi}{4} - 2\pi = -\dfrac{11\pi}{4}\).'
  hint: Coterminal angles differ by whole turns. Add or subtract \(360\text{°}\) (or \(2\pi\) radians) as many times as you need.
  slips:
  - Adding \(180\text{°}\) or \(\pi\). That gives the opposite direction, not the same terminal side.
  - 'Mixing units: adding \(360\) to an angle written in radians.'
  - Getting the negative answer by flipping the sign of the angle. \(-170\text{°}\) is not coterminal with \(170\text{°}\).
- id: PE1-26
  standard: TR2
  stem: A circular sector has radius \(r = 10\) cm and central angle \(\theta = \dfrac{5\pi}{6}\) radians.
  parts:
  - q: Find the exact arc length.
    a: \(s = r\theta = 10\cdot\dfrac{5\pi}{6} = \dfrac{25\pi}{3}\) cm.
  - q: Find the exact area.
    a: \(A = \dfrac{1}{2}r^{2}\theta = \dfrac{1}{2}(100)\left(\dfrac{5\pi}{6}\right) = \dfrac{125\pi}{3}\) cm\(^{2}\).
  hint: With \(\theta\) in radians, arc length is \(s = r\theta\) and sector area is \(A = \dfrac{1}{2}r^{2}\theta\). Keep \(\pi\) in the answer for "exact".
  slips:
  - Using \(A = r\theta\), which is the arc length formula, or \(\pi r^{2}\), which is the whole circle.
  - Forgetting to square the radius in the area formula.
  - Converting to degrees first and then using the radian formulas.
- id: PE1-27
  standard: PR1
  stem: Consider \(q(x) = 2x^{2} - 8x + 3\).
  parts:
  - q: Does the parabola open upward or downward?
    a: Upward, because \(a = 2 > 0\).
  - q: Find the vertex and classify it.
    a: \(x = -\dfrac{-8}{2(2)} = 2\) and \(q(2) = 8 - 16 + 3 = -5\). The vertex is \((2,-5)\), a minimum.
  - q: State the axis of symmetry, domain, and range.
    a: Axis of symmetry \(x = 2\); domain \((-\infty,\infty)\); range \([-5,\infty)\).
  hint: The sign of \(a\) gives the direction. The vertex has \(x = -\dfrac{b}{2a}\); substitute that into \(q\) to get the \(y\)-value. The range starts (or ends) at the \(y\)-value of the vertex.
  slips:
  - Writing the axis of symmetry as \(y = 2\). It is a vertical line, \(x = 2\).
  - Dropping the negative sign in \(-\dfrac{b}{2a}\) and getting \(x = -2\).
  - Writing the range as \([2,\infty)\). The range uses the \(y\)-value of the vertex, \(-5\).
- id: PE1-28
  standard: PR1
  stem: ''
  parts:
  - q: Rewrite \(g(x) = 3x^{2} + 12x + 7\) in vertex form by completing the square.
    a: \(g(x) = 3(x^{2} + 4x) + 7 = 3(x^{2} + 4x + 4 - 4) + 7 = 3(x+2)^{2} - 12 + 7 = 3(x+2)^{2} - 5\).
  hint: Factor the leading coefficient out of the \(x^{2}\) and \(x\) terms. Inside the parentheses add and subtract the square of half the middle coefficient.
  slips:
  - Adding \(4\) inside the parentheses without subtracting it. The \(3\) multiplies it, so you have changed the function by \(12\).
  - Using \(\left(\dfrac{12}{2}\right)^{2} = 36\) without first factoring out the \(3\).
  - Writing \((x-2)^{2}\) instead of \((x+2)^{2}\).
- id: PE1-29
  standard: FN2
  stem: Let \(f(x) = 2x^{2} - 5x\).
  parts:
  - q: Evaluate \(f(-3)\).
    a: \(f(-3) = 2(-3)^{2} - 5(-3) = 18 + 15 = 33\).
  - q: Find and simplify \(f(a+2)\).
    a: \(f(a+2) = 2(a+2)^{2} - 5(a+2) = 2a^{2} + 8a + 8 - 5a - 10 = 2a^{2} + 3a - 2\).
  hint: 'Replace every \(x\) with the input, and use parentheses. For \(a + 2\), expand the square completely: \((a+2)^{2} = a^{2} + 4a + 4\).'
  slips:
  - 'Writing \(2(-3)^{2}\) as \(-18\). Square first: \((-3)^{2} = 9\).'
  - Expanding \((a+2)^{2}\) as \(a^{2} + 4\).
  - Forgetting to distribute the \(-5\) to both \(a\) and \(2\).
  - Treating \(f(a+2)\) as \(f(a) + 2\).
- id: PE1-30
  standard: FN2
  stem: ''
  parts:
  - q: If \(g(x) = 4x - 7\), solve \(g(x) = 13\).
    a: \(4x - 7 = 13\), so \(4x = 20\) and \(x = 5\).
  - q: If \(k(x) = x^{2} - 9\), solve \(k(x) = 16\).
    a: \(x^{2} - 9 = 16\), so \(x^{2} = 25\) and \(x = \pm 5\). Both \(5\) and \(-5\) work.
  hint: Set the formula equal to the output and solve for \(x\). The input is the unknown, not the output.
  slips:
  - Evaluating \(g(13)\) instead of solving \(g(x) = 13\).
  - Giving only \(x = 5\) in (b). A squared variable has two solutions.
  - Forgetting to add \(9\) to both sides before taking the square root.
  note: Lab wrote the second function as h(x); renamed k(x) because h is reserved for the increment in f(x+h) (CONVENTIONS.md).
- id: PE1-31
  standard: LF3
  stem: ''
  parts:
  - q: Find an equation of the line containing the point \((4,-6)\) whose \(x\)-intercept is \(1\).
    a: The \(x\)-intercept is the point \((1,0)\). The slope is \(m = \dfrac{0-(-6)}{1-4} = -2\), so \(y = -2(x-1) = -2x + 2\).
  hint: An \(x\)-intercept of \(1\) means the line passes through \((1,0)\). Now you have two points on the line.
  slips:
  - Using \((0,1)\) for the intercept. An \(x\)-intercept has \(y = 0\).
  - Subtracting the coordinates in a different order on the top and the bottom of the slope.
  - Stopping at the slope. The question asks for an equation.
  note: Lab tag was LF2. Retagged LF3 to match blueprint item type LF3.a (equation from a point and an x-intercept).
- id: PE1-32
  standard: LF3
  stem: ''
  parts:
  - q: Find an equation of the line whose \(x\)-intercept is \(-5\) and whose \(y\)-intercept is \(8\).
    a: The points are \((-5,0)\) and \((0,8)\). The slope is \(m = \dfrac{8-0}{0-(-5)} = \dfrac{8}{5}\) and the \(y\)-intercept is \(8\), so \(y = \dfrac{8}{5}x + 8\).
  hint: 'Each intercept is a point: \((-5,0)\) and \((0,8)\). Find the slope from those two points. The \(y\)-intercept is already given.'
  slips:
  - Writing the points with the coordinates swapped, \((0,-5)\) and \((8,0)\).
  - A sign error in \(0 - (-5)\).
  - Using run over rise, \(\dfrac{5}{8}\), instead of rise over run.
  note: Lab tag was LF2. Retagged LF3 to match blueprint item type LF3.b (equation from both intercepts).
- id: PE1-33
  standard: FN4
  stem: Each panel shows a parent function \(f\) (dashed) and its transformed graph \(g\) (solid). In panel A, \(f(x) = |x|\). In panel B, \(f(x) = \sqrt{x}\). For each panel, describe the transformations from \(f\) to \(g\),
