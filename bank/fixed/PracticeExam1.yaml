- id: PE1-15
  standard: LF5
  stem: Internet Plan A costs $25 per month plus $0.08 per GB of data. Plan B costs a flat $45 per month.
  parts:
  - q: Write linear cost models \(C_A(x)\) and \(C_B(x)\) for \(x\) GB of data.
    a: \(C_A(x) = 0.08x + 25\) and \(C_B(x) = 45\).
  - q: Find the break-even point by solving \(C_A(x) = C_B(x)\).
    a: \(0.08x + 25 = 45\), so \(x = 250\) GB. At \(250\) GB both plans cost $45.
  hint: A linear model is (rate) \(\cdot\, x\) + (fixed amount). Plan B has no per-GB charge. Break-even means the two costs are equal.
  slips:
  - 'Attaching the fixed fee to \(x\): writing \(25x + 0.08\).'
  - Writing \(C_B(x) = 45x\). A flat fee does not grow with the amount of data.
  - Stopping at \(x = 250\) with no units, or giving the cost instead of the number of GB.
- id: PE1-16
  standard: LF5
  stem: A candle's height, in inches, is modeled by \(H(x) = 10 - 0.5x\), where \(x\) is the number of hours burned.
  parts:
  - q: State the slope and describe its meaning in context.
    a: 'The slope is \(-0.5\): the candle''s height decreases by \(0.5\) inch each hour.'
  - q: After how many hours will the candle be \(4\) inches tall?
    a: \(4 = 10 - 0.5x\), so \(x = 12\) hours.
  hint: The slope is the coefficient of \(x\). Say what changes, by how much, and per what unit. For (b), set \(H(x) = 4\) and solve for \(x\).
  slips:
  - Calling the slope \(10\). That is the starting height (the intercept).
  - Dropping the negative sign. The candle is shrinking, so the rate is negative and your sentence should say "decreases".
  - Computing \(H(4)\) instead of solving \(H(x) = 4\).
- id: PE1-17
  standard: TR5
  stem: ''
  parts:
  - q: Find the exact value of \(\sin\left(\dfrac{7\pi}{4}\right)\).
    a: \(-\dfrac{\sqrt{2}}{2}\). The reference angle is \(\dfrac{\pi}{4}\), and in Quadrant IV sine is negative.
  - q: The terminal point \(P(x,y) = \left(\dfrac{5}{13}, -\dfrac{12}{13}\right)\) lies on the unit circle at angle \(\theta\). Find \(\tan\theta\).
    a: \(\tan\theta = \dfrac{y}{x} = \dfrac{-12/13}{5/13} = -\dfrac{12}{5}\).
  hint: On the unit circle \(\cos\theta = x\), \(\sin\theta = y\), and \(\tan\theta = \dfrac{y}{x}\). For (a), find the reference angle and the quadrant, then decide the sign.
  slips:
  - Giving \(+\dfrac{\sqrt{2}}{2}\). In Quadrant IV the \(y\)-coordinate is negative.
  - Computing \(\tan\theta\) as \(\dfrac{x}{y}\).
  - Giving \(\tan\theta = y\) because the point is on the unit circle. That is true for sine, not tangent.
- id: PE1-18
  standard: TR5
  stem: ''
  parts:
  - q: In which quadrant must the terminal side of \(\theta\) lie if \(\sin\theta < 0\) and \(\tan\theta > 0\)?
    a: Quadrant III. \(\sin\theta < 0\) means Quadrant III or IV, and \(\tan\theta > 0\) means Quadrant I or III. Only III satisfies both.
  - q: The unit circle shows the terminal point \(P\left(-\dfrac{\sqrt{2}}{2}, -\dfrac{\sqrt{2}}{2}\right)\) at \(\theta = \dfrac{5\pi}{4}\). Find the reference angle, then \(\sin\theta\) and \(\cos\theta\).
    a: \(\theta_r = \dfrac{5\pi}{4} - \pi = \dfrac{\pi}{4}\). \(\sin\theta = -\dfrac{\sqrt{2}}{2}\) and \(\cos\theta = -\dfrac{\sqrt{2}}{2}\).
  hint: Sine is the \(y\)-coordinate and cosine is the \(x\)-coordinate. Tangent is \(\dfrac{y}{x}\), so it is positive when \(x\) and \(y\) have the same sign. The reference angle is the acute angle between the terminal side
    and the \(x\)-axis.
  slips:
  - Using only one condition. Two quadrants satisfy \(\sin\theta < 0\); the tangent condition picks between them.
  - Giving \(\dfrac{5\pi}{4}\) or \(2\pi - \dfrac{5\pi}{4}\) as the reference angle. In Quadrant III, subtract \(\pi\).
  - Swapping which coordinate is sine and which is cosine.
- id: PE1-19
  standard: FN5
  stem: Let \(f(x) = 2x - 3\) and \(g(x) = x^{2} + 2\).
  parts:
  - q: Find \((f+g)(x)\).
    a: \(f(x) + g(x) = 2x - 3 + x^{2} + 2 = x^{2} + 2x - 1\).
  - q: Find \(\left(\dfrac{f}{g}\right)(x)\).
    a: \(\dfrac{f(x)}{g(x)} = \dfrac{2x-3}{x^{2}+2}\).
  - q: Find \((f\circ g)(x)\), the composition of \(f\) and \(g\).
    a: \(f(g(x)) = 2(x^{2}+2) - 3 = 2x^{2} + 1\).
  hint: \((f+g)(x)\) means \(f(x) + g(x)\). For \(f\circ g\), put the whole expression \(g(x)\) wherever \(x\) appears in \(f\).
  slips:
  - Computing \(g(f(x))\) instead. In \(f\circ g\), the function \(g\) goes first.
  - Forgetting to distribute the \(2\) across both terms of \(x^{2} + 2\).
  - Multiplying \(f(x)\cdot g(x)\) when asked for the composition.
- id: PE1-20
  standard: FN5
  stem: Use the table to find each value.
  parts:
  - q: \(f(g(1))\)
    a: \(g(1) = 3\), then \(f(3) = 1\), so \(f(g(1)) = 1\).
  - q: \(g(f(2))\)
    a: \(f(2) = 4\), then \(g(4) = 2\), so \(g(f(2)) = 2\).
  hint: Work from the inside out. Look up the inner function first, then use that result as the input to the outer function.
  slips:
  - Looking up the outer function first.
  - Reading \(f(g(1))\) as \(f(1)\cdot g(1)\).
  - Using the wrong row. In this table the \(g\) row is first and the \(f\) row is second.
