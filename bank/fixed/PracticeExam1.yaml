    a: Reflect \(f\) across the \(y\)-axis, then shift it left \(2\) units. The starting point moves from \((0,0)\) to \((-2,0)\).
  - q: Write \(g(x)\) in terms of \(f\), and then as an explicit formula.
    a: \(g(x) = f(-(x+2)) = \sqrt{-x-2}\), with domain \((-\infty,-2]\).
