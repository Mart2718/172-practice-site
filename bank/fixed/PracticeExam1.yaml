- id: PE1-35
  standard: FN1
  stem: Graph A and Graph B are shown. A dashed vertical line is drawn on each.
  parts:
  - q: Which graph represents a function? Explain using the Vertical Line Test.
    a: 'Graph A represents a function: every vertical line intersects it at most once. Graph B does not: a vertical line through the circle, for example the \(y\)-axis, intersects it twice.'
  hint: Imagine sweeping a vertical line across each graph. A function gives each input one output, so a vertical line can never touch the graph of a function twice.
  slips:
  - Using a horizontal line. That tests whether a function is one-to-one, which is a different question.
  - Saying the circle fails because it is round. The reason is that some vertical line meets it twice.
  - Saying Graph A fails because it goes down and then up. A function may increase and decrease.
