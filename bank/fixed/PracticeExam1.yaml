# Hand-written problems that appear exactly as written (no generator, no random versions).
# These are the 38 questions from the Exam 1 review site, rewritten in LaTeX with hints and common slips.
# Fields: id, standard, stem, parts[q,a], hint, slips[], figures[file,alt,table], table (a data table in the problem body), note.
# `note` records any change from the original Lab item; the site does not show it.
source: Practice Exam 1 review (the 38 questions on the Exam 1 review site, 172exam1review)
items:
- id: PE1-01
  standard: PR2
  stem: A ball is thrown upward. Its height after \(t\) seconds is \(H(t) = -16t^{2} + 80t\), in feet.
  parts:
  - q: At what time is the height a maximum?
    a: \(t = -\dfrac{80}{2(-16)} = 2.5\) seconds.
  - q: What is the maximum height?
    a: \(H(2.5) = -16(2.5)^{2} + 80(2.5) = 100\) feet.
  hint: The graph of a quadratic function is a parabola, and this one opens downward, so the maximum is at the vertex. The vertex is at \(t = -\dfrac{b}{2a}\). The height is the output, so put that time back into \(H\).
  slips:
  - Stopping at the time. Part (b) asks for a height, which is an output of \(H\), not the input \(2.5\).
  - Losing the negative sign in \(-\dfrac{b}{2a}\). Here \(a = -16\), so the denominator is negative and the two negatives cancel.
  - Leaving off units. Time is in seconds and height is in feet.
  note: Lab wrote the function as h(t); renamed H(t) because h is reserved for the increment in f(x+h) (CONVENTIONS.md).
- id: PE1-02
  standard: PR2
  stem: The cost, in dollars, to produce \(x\) units is \(C(x) = 0.4x^{2} - 100x + 8500\).
  parts:
  - q: How many units minimize the cost?
    a: \(x = -\dfrac{-100}{2(0.4)} = 125\) units.
  - q: What is the minimum cost?
    a: \(C(125) = 0.4(125)^{2} - 100(125) + 8500\), so the minimum cost is $2,250.
  hint: This parabola opens upward, so the vertex is a minimum. Find the vertex input with \(-\dfrac{b}{2a}\), then evaluate \(C\) there for the cost.
  slips:
  - Using \(b = 100\) instead of \(b = -100\). The sign of \(b\) matters.
  - Giving \(125\) as the minimum cost. \(125\) is the number of units (the input); the cost is the output.
  - Leaving off units or the dollar sign.
  note: Lab answer had a formatting error in the dollar amount; the value 2,250 was already correct.
- id: PE1-03
  standard: TR1
  stem: ''
  parts:
  - q: Convert \(165\text{°}\) to radians.
    a: \(165\text{°}\cdot\dfrac{\pi}{180\text{°}} = \dfrac{11\pi}{12}\).
  - q: Convert \(\dfrac{3\pi}{5}\) radians to degrees.
    a: \(\dfrac{3\pi}{5}\cdot\dfrac{180\text{°}}{\pi} = 108\text{°}\).
  hint: To change degrees to radians multiply by \(\dfrac{\pi}{180\text{°}}\). To change radians to degrees multiply by \(\dfrac{180\text{°}}{\pi}\). Reduce the fraction.
  slips:
  - 'Using the conversion factor upside down. Check the answer: \(165\text{°}\) is a bit less than a half turn, so its radian measure should be a bit less than \(\pi\).'
  - Not reducing \(\dfrac{165\pi}{180}\) to lowest terms.
  - Leaving \(\pi\) in a degree answer. When you convert from radians, the \(\pi\) cancels.
- id: PE1-04
  standard: TR1
  stem: ''
  parts:
  - q: Convert \(-100\text{°}\) to radians.
    a: \(-100\text{°}\cdot\dfrac{\pi}{180\text{°}} = -\dfrac{5\pi}{9}\).
  - q: Convert \(-\dfrac{9\pi}{4}\) radians to degrees.
    a: \(-\dfrac{9\pi}{4}\cdot\dfrac{180\text{°}}{\pi} = -405\text{°}\).
  hint: 'Convert exactly as you would a positive angle. The negative sign stays: it means the angle is measured clockwise.'
  slips:
  - Dropping the negative sign.
  - Replacing \(-405\text{°}\) with a coterminal angle. The question asks for the same measure in different units, not a different angle.
  - Using the conversion factor upside down.
- id: PE1-05
  standard: FN1
  stem: ''
  parts:
  - q: Find the domain and range of the relation \(\{(-3,4),(1,2),(3,4),(5,-2)\}\).
    a: 'Domain: \(\{-3,1,3,5\}\). Range: \(\{-2,2,4\}\).'
  - q: Does the relation \(\{(2,5),(6,1),(2,9)\}\) define a function? Explain.
    a: No. The input \(2\) is paired with two different outputs, \(5\) and \(9\).
  hint: The domain is the set of inputs (first coordinates) and the range is the set of outputs (second coordinates). A function gives every input exactly one output.
  slips:
  - Listing a repeated output twice in the range. In a set, \(4\) is listed once.
  - Checking for repeated outputs. A function only forbids one <em>input</em> with two different outputs; two inputs may share an output.
  - 'Mixing up the coordinates: the domain comes from the first number in each pair.'
- id: PE1-06
  standard: FN1
  stem: Find the domain of each function. Write your answer in interval notation.
  parts:
  - q: \(f(x) = \dfrac{x+3}{x-6}\)
    a: 'The denominator cannot be \(0\), so \(x \ne 6\). Domain: \((-\infty,6)\cup(6,\infty)\).'
  - q: \(g(x) = \sqrt{3x-12}\)
    a: 'The radicand must be at least \(0\): \(3x-12 \ge 0\), so \(x \ge 4\). Domain: \([4,\infty)\).'
  hint: 'Ask which inputs would break the function: dividing by zero in (a), or a negative number under a square root in (b). Write what is left in interval notation.'
  slips:
  - Excluding \(x=-3\) in (a). Only the denominator can make a rational function undefined; a numerator of \(0\) is fine.
  - Writing \((4,\infty)\) in (b). At \(x=4\) the radicand is \(0\), and \(\sqrt{0}\) is defined, so \(4\) is included.
  - Putting a bracket next to \(\infty\). Infinity is never included.
  note: Lab tag was FN3. Retagged FN1 to match blueprint item types FN1.d (domain of a radical function) and the FN1 radical and rational domain templates.
- id: PE1-07
  standard: FN6
  stem: A one-to-one function \(f\) is given by the table.
  parts:
  - q: Find \(f^{-1}(2)\).
    a: \(f^{-1}(2) = 0\), because \(f(0) = 2\).
  - q: Find \(f^{-1}(-3)\).
    a: \(f^{-1}(-3) = 2\), because \(f(2) = -3\).
  - q: Find \(f^{-1}(6)\).
    a: \(f^{-1}(6) = -1\), because \(f(-1) = 6\).
  hint: \(f^{-1}(b) = a\) means \(f(a) = b\). Find \(b\) in the \(f(x)\) row, then read the input above it.
  slips:
  - Reading \(f^{-1}(2)\) as \(f(2)\). The \(2\) is an output of \(f\), so look for it in the bottom row.
  - Reading \(f^{-1}(2)\) as \(\dfrac{1}{f(2)}\). The \(-1\) in \(f^{-1}\) means inverse, not reciprocal.
  - Reporting the output from the table instead of the input above it.
  table:
    caption: Values of \(f(x)\)
    headers:
    - \(x\)
    - '-1'
    - '0'
    - '2'
    - '4'
    rows:
    - - \(f(x)\)
      - '6'
      - '2'
      - '-3'
      - '-8'
    row_headers: true
- id: PE1-08
  standard: FN6
  stem: Find the inverse formula for each function.
  parts:
  - q: \(f(x) = 6x + 11\)
    a: \(f^{-1}(x) = \dfrac{x-11}{6}\).
  - q: \(g(x) = \dfrac{3x-5}{x+4}\)
    a: 'Swap and solve: \(x = \dfrac{3y-5}{y+4}\), so \(xy + 4x = 3y - 5\), so \(xy - 3y = -4x - 5\), so \(y(x-3) = -4x-5\). Then \(g^{-1}(x) = \dfrac{-4x-5}{x-3} = \dfrac{4x+5}{3-x}\).'
  hint: Write \(y = f(x)\), swap \(x\) and \(y\), then solve for \(y\). In (b), collect every \(y\) term on one side so you can factor \(y\) out.
  slips:
  - Solving for \(y\) but forgetting to swap \(x\) and \(y\).
  - Writing \(f^{-1}(x) = \dfrac{1}{6x+11}\). The \(-1\) is not an exponent.
  - In (b), dividing instead of factoring when \(y\) appears in two terms.
- id: PE1-09
  standard: LF2
  stem: ''
  parts:
  - q: Write in point-slope form the line with slope \(-3\) through \((2,-5)\).
    a: \(y + 5 = -3(x-2)\).
  - q: Write in slope-intercept form the line through \((0,4)\) and \((3,13)\).
    a: \(m = \dfrac{13-4}{3-0} = 3\) and the \(y\)-intercept is \(4\), so \(y = 3x + 4\).
  hint: Point-slope form is \(y - y_1 = m(x - x_1)\). With two points, find the slope first. The point on the \(y\)-axis gives the intercept directly.
  slips:
  - Writing \(y - 5\) instead of \(y + 5\). Subtracting \(-5\) gives \(+5\).
  - Putting the point's coordinates in the wrong places, for example \(y - 2 = -3(x + 5)\).
  - Subtracting the coordinates in a different order on the top and the bottom of the slope.
- id: PE1-10
  standard: LF2
  stem: ''
  parts:
  - q: Determine the slope and \(y\)-intercept of the line \(5x + 2y = 14\).
    a: 'Solve for \(y\): \(2y = -5x + 14\), so \(y = -\dfrac{5}{2}x + 7\). The slope is \(-\dfrac{5}{2}\) and the \(y\)-intercept is \((0,7)\).'
  hint: Solve for \(y\) so the equation looks like \(y = mx + b\). Divide every term, including the right side, by the coefficient of \(y\).
  slips:
  - Reading the slope as \(5\) straight from the equation. This is standard form, not slope-intercept form.
  - Dividing only some terms by \(2\). The \(14\) must be divided too.
  - Losing the sign when moving \(5x\) to the other side.
- id: PE1-11
  standard: PF1
  stem: For each function, identify the amplitude, period, midline, and phase shift.
  parts:
  - q: \(y = 2\sin(4x - \pi) + 3\)
    a: Amplitude \(2\); period \(\dfrac{\pi}{2}\); midline \(y = 3\); phase shift \(\dfrac{\pi}{4}\) to the right, because \(4x - \pi = 4\left(x - \dfrac{\pi}{4}\right)\).
  - q: \(y = -\cos\left(\dfrac{1}{3}x + \dfrac{\pi}{6}\right) - 4\)
    a: Amplitude \(1\); period \(6\pi\); midline \(y = -4\); phase shift \(\dfrac{\pi}{2}\) to the left, because \(\dfrac{1}{3}x + \dfrac{\pi}{6} = \dfrac{1}{3}\left(x + \dfrac{\pi}{2}\right)\).
  hint: Compare with \(y = A\sin(B(x - C)) + D\). The amplitude is \(|A|\), the period is \(\dfrac{2\pi}{B}\), and the midline is \(y = D\). For the phase shift, factor \(B\) out of the parentheses first.
  slips:
  - 'Reading the phase shift as \(\pi\) in (a). Factor out the \(4\): the shift is \(\dfrac{\pi}{4}\).'
  - Calling the amplitude \(-1\) in (b). Amplitude is never negative; the minus sign is a reflection.
  - Using \(B = 3\) in (b). The coefficient of \(x\) is \(\dfrac{1}{3}\), so the period is \(2\pi \div \dfrac{1}{3}\).
- id: PE1-12
  standard: PF1
  stem: A sinusoidal wave \(y = A\sin(Bx)\), with \(A > 0\) and \(B > 0\), has a peak at \(\left(\dfrac{\pi}{4}, 3\right)\) and the next trough at \(\left(\dfrac{3\pi}{4}, -3\right)\).
  parts:
  - q: Find the amplitude and period.
    a: 'Amplitude \(= 3\). A peak to the next trough is half a period: \(\dfrac{3\pi}{4} - \dfrac{\pi}{4} = \dfrac{\pi}{2} = \dfrac{T}{2}\), so \(T = \pi\).'
  - q: Write the equation.
    a: \(B = \dfrac{2\pi}{\pi} = 2\), so \(y = 3\sin(2x)\).
  hint: The amplitude is the height of the peak above the midline. A peak and the very next trough are half a period apart.
  slips:
  - Using the distance \(\dfrac{\pi}{2}\) as the full period. It is only half.
  - Writing \(B = \text{period}\). The relationship is \(B = \dfrac{2\pi}{\text{period}}\).
  - Giving the amplitude as \(6\), the distance from the peak to the trough.
- id: PE1-13
  standard: FN3
  stem: Use the graph of \(f\).
  parts:
  - q: State the domain and range.
    a: Domain \([-4,5]\); range \([-4,5]\).
  - q: State the interior local minimum and maximum values, with their \(x\)-locations.
    a: Local minimum \(-4\) at \(x = -1\); local maximum \(5\) at \(x = 2\).
  - q: State the intervals where \(f\) is increasing and where it is decreasing.
    a: Decreasing on \((-4,-1)\cup(2,5)\); increasing on \((-1,2)\).
  hint: Read the domain from left to right and the range from bottom to top. "Interior" means not at an endpoint. Increasing and decreasing are described with \(x\)-intervals, read left to right.
  slips:
  - Giving the \(y\)-value when the question asks for the \(x\)-location, or the reverse.
  - Reporting an endpoint as a local minimum or maximum. Interior extrema exclude the endpoints.
  - Describing increasing and decreasing intervals with \(y\)-values. They are intervals of \(x\).
