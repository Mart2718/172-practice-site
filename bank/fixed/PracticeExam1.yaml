- id: PE1-14
  standard: FN3
  stem: Use the graph of \(g\).
  parts:
  - q: State the domain and range.
    a: Domain \([-6,3]\); range \([-3,6]\).
  - q: State the interior local maximum and minimum values, with their \(x\)-locations.
    a: Local maximum \(6\) at \(x = -3\); local minimum \(-3\) at \(x = 0\).
  - q: State the intervals where \(g\) is increasing and where it is decreasing.
    a: Increasing on \((-6,-3)\cup(0,3)\); decreasing on \((-3,0)\).
  hint: Read the domain from left to right and the range from bottom to top, including the endpoints. "Interior" means not at an endpoint.
  slips:
  - Giving the \(y\)-value when the question asks for the \(x\)-location, or the reverse.
